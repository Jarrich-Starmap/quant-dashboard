  <path d="M698 90 L852 90 Q860 90 860 98 L860 110 L690 110 L690 98 Q690 90 698 90 Z" fill="#d4a017"/>
  <text x="775" y="105" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">SQLite WAL</text>
  <text x="775" y="130" text-anchor="middle" font-size="9" fill="#7f8c8d" font-weight="600">TABLES</text>
  <rect x="710" y="138" width="130" height="22" rx="4" fill="#fdf6e3" stroke="#e8d8a0"/>
  <text x="775" y="153" text-anchor="middle" font-size="10" fill="#8a7a30">trades</text>
  <rect x="710" y="166" width="130" height="22" rx="4" fill="#fdf6e3" stroke="#e8d8a0"/>
  <text x="775" y="181" text-anchor="middle" font-size="10" fill="#8a7a30">signal_snapshots</text>
  <rect x="710" y="194" width="130" height="22" rx="4" fill="#fdf6e3" stroke="#e8d8a0"/>
  <text x="775" y="209" text-anchor="middle" font-size="10" fill="#8a7a30">ewma_state</text>
  <rect x="710" y="222" width="130" height="22" rx="4" fill="#fdf6e3" stroke="#e8d8a0"/>
  <text x="775" y="237" text-anchor="middle" font-size="10" fill="#8a7a30">kline_cache</text>
  <text x="775" y="268" text-anchor="middle" font-size="9" fill="#7f8c8d">线程安全</text>
  <text x="775" y="282" text-anchor="middle" font-size="9" fill="#7f8c8d">持久化存储</text>
  <text x="775" y="296" text-anchor="middle" font-size="9" fill="#7f8c8d">WAL 模式</text>

  <!-- DB connections (dashed) -->
  <line x1="660" y1="137" x2="690" y2="149" stroke="#d4a017" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="660" y1="235" x2="690" y2="205" stroke="#d4a017" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="660" y1="333" x2="690" y2="333" stroke="#d4a017" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="660" y1="431" x2="690" y2="378" stroke="#d4a017" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Feedback Loop -->
  <path d="M 350 460 Q 350 505 200 505 Q 18 505 18 300 Q 18 226 40 226" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <rect x="95" y="494" width="250" height="22" rx="4" fill="#fdeaea" stroke="#e74c3c" stroke-width="1"/>
  <text x="220" y="509" text-anchor="middle" font-size="10" fill="#e74c3c" font-weight="600">反馈环路：α · softmax · 波动率 权重在线更新</text>
  <rect x="400" y="494" width="180" height="22" rx="4" fill="#f4f5f7" stroke="#e8ecf1"/>
  <text x="490" y="509" text-anchor="middle" font-size="10" fill="#7f8c8d">config.yaml · 五品种独立参数</text>
  <rect x="600" y="494" width="110" height="22" rx="4" fill="#e8f4fd" stroke="#2980b9" stroke-width="1"/>
  <text x="655" y="509" text-anchor="middle" font-size="10" fill="#2980b9" font-weight="600">main.py 主控</text>

  <!-- Legend -->
  <rect x="40" y="532" width="820" height="30" rx="6" fill="#fff" stroke="#e8ecf1"/>
  <line x1="60" y1="547" x2="90" y2="547" stroke="#2980b9" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="98" y="551" font-size="10" fill="#7f8c8d">数据流</text>
  <line x1="160" y1="547" x2="190" y2="547" stroke="#d4a017" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="198" y="551" font-size="10" fill="#7f8c8d">DB 读写</text>
  <line x1="260" y1="547" x2="290" y2="547" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="298" y="551" font-size="10" fill="#7f8c8d">反馈环路（下一周期生效）</text>
  <rect x="490" y="542" width="12" height="10" rx="2" fill="#2980b9"/>
  <text x="510" y="551" font-size="10" fill="#7f8c8d">数据/信号/执行层</text>
  <rect x="620" y="542" width="12" height="10" rx="2" fill="#27ae60"/>
