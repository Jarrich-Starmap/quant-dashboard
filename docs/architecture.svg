  <text x="505" y="427" text-anchor="middle" font-size="12" fill="#2c3e50" font-weight="600">optimizer.py</text>
  <text x="505" y="442" text-anchor="middle" font-size="10" fill="#7f8c8d">冷却管理 · reward · 仓位乘数</text>
  <line x1="330" y1="431" x2="370" y2="431" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#as)"/>

