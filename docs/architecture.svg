  <line x1="525" y1="70" x2="525" y2="90" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Data Layer -->
  <rect x="40" y="90" width="620" height="76" rx="8" fill="#fff" stroke="#e8ecf1" stroke-width="1.5"/>
  <path d="M48 90 L652 90 Q660 90 660 98 L660 106 L40 106 L40 98 Q40 90 48 90 Z" fill="#2980b9"/>
  <text x="55" y="102" font-size="10" fill="#fff" font-weight="600">DATA LAYER</text>
  <rect x="60" y="116" width="270" height="42" rx="5" fill="#f4f5f7" stroke="#e8ecf1"/>
  <text x="195" y="133" text-anchor="middle" font-size="12" fill="#2c3e50" font-weight="600">fetcher.py</text>
  <text x="195" y="148" text-anchor="middle" font-size="10" fill="#7f8c8d">新鲜度检查 · K线缓存 · 换月检测</text>
  <rect x="370" y="116" width="270" height="42" rx="5" fill="#f4f5f7" stroke="#e8ecf1"/>
  <text x="505" y="133" text-anchor="middle" font-size="12" fill="#2c3e50" font-weight="600">adapter.py</text>
