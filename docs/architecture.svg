<svg viewBox="0 0 900 575" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2980b9"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#27ae60"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#7f8c8d"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#e74c3c"/></marker>
    <marker id="agold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#d4a017"/></marker>
  </defs>
  <rect width="900" height="575" fill="#f8f9fa" rx="8"/>

  <!-- External Data Sources -->
  <text x="350" y="18" text-anchor="middle" font-size="11" fill="#7f8c8d" font-weight="600" letter-spacing="2">EXTERNAL DATA</text>
  <rect x="100" y="28" width="250" height="42" rx="6" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.5"/>
  <text x="225" y="46" text-anchor="middle" font-size="12" fill="#2980b9" font-weight="600">AkShare · Sina 分钟K线</text>
  <text x="225" y="61" text-anchor="middle" font-size="10" fill="#7f8c8d">AU 沪金 / AG 沪银 / SC 原油</text>
  <rect x="400" y="28" width="250" height="42" rx="6" fill="#e8f8ed" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="46" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="600">Sentiment JSON</text>
  <text x="525" y="61" text-anchor="middle" font-size="10" fill="#7f8c8d">多空情绪 · &gt;2h 过期冻结</text>
